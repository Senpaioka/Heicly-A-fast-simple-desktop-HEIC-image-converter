name: Build & Release Heicly

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Clone Repository
        shell: bash
        run: |
          mkdir -p /c/build_ws
          git clone --depth 1 --branch ${{ github.ref_name }} "https://github.com/${{ github.repository }}.git" /c/build_ws

      - name: Set up uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install Dependencies
        working-directory: C:/build_ws
        run: uv sync

      - name: Run Pytest Suite
        working-directory: C:/build_ws
        run: uv run pytest

      - name: Build Executable with PyInstaller
        working-directory: C:/build_ws
        run: uv run python build_installer.py

      - name: Package Executable into ZIP
        working-directory: C:/build_ws
        shell: powershell
        run: |
          Compress-Archive -Path "dist/Heicly.exe" -DestinationPath "dist/Heicly-Windows-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          files: |
            C:/build_ws/dist/Heicly.exe
            C:/build_ws/dist/Heicly-Windows-x64.zip
          name: Heicly Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
