name: Build & Release Heicly

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install Dependencies
        run: uv sync

      - name: Run Pytest Suite
        run: uv run pytest

      - name: Build Executable with PyInstaller
        run: uv run python build_installer.py

      - name: Package Executable into ZIP
        shell: powershell
        run: |
          Compress-Archive -Path "dist/Heicly.exe" -DestinationPath "dist/Heicly-Windows-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/Heicly.exe
            dist/Heicly-Windows-x64.zip
          name: Heicly Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
